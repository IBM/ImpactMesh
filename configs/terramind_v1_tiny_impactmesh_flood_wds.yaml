# TerraMind-tiny on ImpactMesh-Flood, reading WebDataset shards instead of
# individual files. Identical model and optimizer to
# terramind_v1_tiny_impactmesh_flood.yaml -- only the `data` section differs.
#
# Build the shards from the released per-modality tars first:
#   python -m impactmesh.wds_create_shards \
#       --hf-root data/hf/ImpactMesh-Flood --out data/shards --disaster flood
#
# Shards stream sequentially, so this is the faster option on shared or network
# storage, and the only practical one for multi-node training.
seed_everything: 42
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 16-mixed
#  logger: true # Set to logger: true for Tensorboard
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: ImpactMesh-Flood
      name: TerraMind-Tiny_lr1e-4_wds
      config:
        modalities: S1-S2-DEM
        dataset: IM-Flood

  callbacks:
    - class_path: RichProgressBar
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: EarlyStopping
      init_args:
        monitor: val/loss
        patience: 10
    - class_path: ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_weights_only: true
        dirpath: output/terramind_tiny_impactmesh_flood_wds/1e-4
        filename: best_val_loss
  max_epochs: 50
  log_every_n_steps: 5
  default_root_dir: output/terramind_tiny_impactmesh_flood_wds/
data:
  class_path: impactmesh.wds_impactmesh_datamodule.WdsImpactMeshDataModule
  init_args:
    batch_size: 16
    num_workers: 8
    disaster: flood
    # Shards are an infinite stream, so an epoch is defined by a sample count
    # rather than by exhausting the dataset. This is the size of the train split.
    train_epoch_size: 19448
    train_urls: data/shards/ImpactMesh-Flood/train/train_shard_{000000..000127}.tar
    val_urls: data/shards/ImpactMesh-Flood/val/val_shard_{000000..000007}.tar
    # Seen-event patches are written to the first 8 test shards and held-out
    # events to the last 8, so each subset is a shard range over one copy of the
    # data. Order must match test_dataloaders_names below.
    test_urls:
      test: data/shards/ImpactMesh-Flood/test/test_shard_{000000..000015}.tar
      seen_events: data/shards/ImpactMesh-Flood/test/test_shard_{000000..000007}.tar
      holdout: data/shards/ImpactMesh-Flood/test/test_shard_{000008..000015}.tar
    timesteps: [0, 1, 2, 3]
    modalities:
      - S2L2A
      - S1RTC
      - DEM
    concat_bands: False
    no_data_replace: 0
    train_transform:
      - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
      - class_path: albumentations.D4
      - class_path: albumentations.pytorch.ToTensorV2
      - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
        init_args:
          n_timesteps: 4

model:
  class_path: terratorch.tasks.SemanticSegmentationTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: terramind_v1_tiny
      backbone_pretrained: true
      backbone_modalities:
        - S2L2A
        - S1RTC
        - DEM

      # Apply temporal wrapper (docs: https://terrastackai.github.io/terratorch/stable/guide/temporal_wrapper/)
      backbone_use_temporal: true
      backbone_temporal_pooling: mean

      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]  # indices for terramind_v1_tiny, small, and base
#          indices: [5, 11, 17, 23]  # large version
        - name: ReshapeTokensToImage
          remove_cls_token: False
        - name: LearnedInterpolateToPyramidal

      decoder: UNetDecoder
      decoder_channels: [256, 128, 64, 32] # tiny
#      decoder_channels: [512, 256, 128, 64] # base

      head_dropout: 0.1
      num_classes: 3
    loss: dice
    ignore_index: -1
    test_dataloaders_names: [test, seen_events, holdout]
    freeze_backbone: false
    freeze_decoder: false
    class_weights: [0.044, 0.487, 0.469]
    # For prediction: overlap of 16 pixel on each side, 8 pixels dropped
    tiled_inference_parameters:
      crop: 256
      stride: 208
      batch_size: 64
      delta: 8

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1.e-4
lr_scheduler:
  class_path: ReduceLROnPlateau
  init_args:
    monitor: val/loss
    factor: 0.5
    patience: 2

